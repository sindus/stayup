services:
  check_changelog:
    build: .
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      STAYUP_API_URL: ${STAYUP_API_URL:-http://localhost:3000}
      STAYUP_API_KEY: ${STAYUP_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  test:
    build: .
    entrypoint: ["python", "-m", "pytest", "tests/", "-v"]
    restart: "no"
